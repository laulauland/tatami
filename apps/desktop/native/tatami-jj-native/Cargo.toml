[package]
name = "tatami-jj-native"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
futures = "0.3.31"
hex = "0.4.3"
jj-lib = "0.35.0"
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
pollster = "0.4.0"
rayon = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2.7.0"
tokio = { version = "1.48.0", features = ["io-util"] }
whoami = "1.6.1"

[build-dependencies]
napi-build = "2"
